name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm sync-version
      - name: Ensure no nested docs lockfile is committed
        run: |
          if [[ -f docs/pnpm-lock.yaml ]]; then
            echo "docs/pnpm-lock.yaml should not exist in this workspace."
            echo "Use the root pnpm-lock.yaml as the single lockfile source of truth."
            exit 1
          fi
      - name: Verify generated docs metadata is committed
        run: git diff --exit-code -- docs/src/lib/site-meta.ts
      - name: Secret scan - detect accidental API keys
        run: |
          if git grep -n "GEMINI_API""_KEY=AI" -- ':!.github/workflows/' >/dev/null 2>&1; then
            echo "ERROR: GEMINI_API_KEY value found in repository; remove it and rotate the key."
            git --no-pager grep -n "GEMINI_API""_KEY=AI" -- ':!.github/workflows/'
            exit 1
          fi
      - run: pnpm docs:test
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
