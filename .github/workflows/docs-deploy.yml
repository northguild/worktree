name: Deploy Docs

# Two deploys, once per stable release (#241):
#   site          - the Astro build, as a Worker with static assets on northguild.dev/worktree* (docs/wrangler.jsonc)
#   legacy-pages  - the generated bundle on https://northguild.github.io/worktree/: the schema file plus a
#                   redirect stub per old route
# publish.yml calls this workflow (workflow_call) after it publishes a stable version; the deploy builds the
# release commit. Nothing else triggers it except workflow_dispatch, the manual route for a docs fix that cannot
# wait. Run it from main: from any other ref the `site` job's guard skips it, and legacy-pages with it, so nothing
# deploys. The Cloudflare secrets are not passed in: they are the `cloudflare-production` environment's, which the
# `site` job reads for itself and which admits only main (#253).
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    # A manual run from any other branch deploys nothing (#243); legacy-pages needs this job, so it skips too.
    # The same guard publish.yml's `guard` job uses. A workflow_call sees the caller's ref, and publish.yml runs
    # only on main, so the release deploy passes it. The guard only skips early: workflow_dispatch runs the selected
    # branch's copy of this file, so a branch can drop it. The environment below is what enforces main-only (#253).
    if: github.ref == 'refs/heads/main'
    # Holds CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and its deployment-branch policy admits only main, so a
    # run from any other ref is refused before a step runs. The same environment worker-deploy.yml's `deploy` job
    # uses. A workflow_call run is checked against the caller's ref, which is main.
    environment: cloudflare-production
    # Both jobs set their own timeout: the publish.yml job that calls this workflow cannot set one, and while they
    # run they hold its `publish` concurrency group, so a hang would hold back the next release.
    timeout-minutes: 20
    # An in-flight deploy is never cancelled mid-publish.
    concurrency:
      group: docs-site
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The audit's "Last updated" rule reads git history for each page's source file.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:test

      - run: pnpm docs:build
        env:
          # Public URL of the deployed chat Worker, baked into the static bundle at build time.
          # Set as a repository variable (not a secret) in GH repo settings > Variables.
          PUBLIC_GEMINI_WORKER_URL: ${{ vars.GEMINI_WORKER_URL }}

      # Nothing deploys unless the built site passes the SEO audit (docs/scripts/audit-dist.mjs).
      - run: pnpm docs:audit-dist

      # Copies docs/dist to docs/.deploy/worktree, the directory docs/wrangler.jsonc serves: a Route does not
      # strip its path, so the files must sit under worktree/.
      - run: pnpm --filter docs stage:deploy

      # The wrangler in the docs workspace's lockfile, run through pnpm; no wrangler-action, which runs npx.
      - name: Deploy the Worker
        working-directory: docs
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Live routes, retried for route propagation (docs/scripts/deploy-smoke.mjs). A failure marks the run
      # red and does not roll back.
      - name: Smoke-test the deployed routes
        run: pnpm --filter docs deploy:smoke

  legacy-pages:
    # Only after the new site answers: the stubs redirect to it.
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - run: pnpm install --frozen-lockfile
      # Writes docs/legacy/ (schema/v1.json, one stub per old route, 404.html).
      - run: pnpm --filter docs build:legacy

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/legacy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
