name: Skill scan

# Runs Snyk Agent Scan (https://github.com/snyk/agent-scan) over the shipped skills and REPORTS what it
# finds. The scan step never fails the job: not on findings, not on a missing token, not on a scanner,
# network or API failure, and not on a slow API (the scan is cut off well inside the job timeout). Only the
# runner's own setup (checkout, installing uv) can still turn it red, and it is not a required check, so
# that never blocks a merge either. The verdict is generated by an LLM and is not deterministic, so the same SKILL.md can pass one
# run and be flagged the next; a check that blocks merges on that would be noise. The point is to show a
# pull request author the same signal skills.sh shows (issue #92, the W011 warning on
# skills/worktree/SKILL.md) before merge, as annotations on the diff and a table in the job summary.
#
# The scan sends the skill text to Snyk's API. That is acceptable here because the skills are already
# public (published to npm and listed on skills.sh).
#
# workflow_dispatch allows a manual rerun, which is worth having for a non-deterministic verdict.
on:
  pull_request:
    branches: [main]
    # The workflow file itself is listed so that a change to it is exercised on its own pull request.
    paths:
      - "skills/**"
      - ".github/workflows/skill-scan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned exactly. The v0.5.x line emits issue codes (W011 and friends) that match what skills.sh
      # displays; v0.6 and later renamed them to risk names, which would no longer line up with issue #92.
      # v0.5.x is planned for deprecation upstream: when it goes, move this pin and expect the codes to
      # change with it.
      SCANNER_VERSION: 0.5.17
    steps:
      # No persisted credentials: nothing here pushes, and the scanner and its dependencies are third-party
      # code that would otherwise find the GITHUB_TOKEN in .git/config.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No cache: the job runs one `uvx` call, there is no uv.lock for the cache key to match, and the
      # default cache setup warns about that on every run.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      # Fork pull requests receive no repository secrets, and the maintainer may not have added SNYK_TOKEN
      # yet; in both cases the token below is the empty string. The token is passed through `env` on this
      # step only and is never echoed. No `--ci` flag: it requires `--dangerously-run-mcp-servers`, and
      # exit 0 regardless of findings is exactly what is wanted.
      - name: Scan skills with Snyk Agent Scan
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${SNYK_TOKEN:-}" ]]; then
            echo "::notice::Snyk skill scan skipped: SNYK_TOKEN is not available (fork pull request, or the repository secret is not set)."
            echo "Snyk skill scan skipped: \`SNYK_TOKEN\` is not available. Fork pull requests get no secrets, and a maintainer must add the repository secret \`SNYK_TOKEN\` for this job to scan." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          out="$RUNNER_TEMP/scan.json"
          err="$RUNNER_TEMP/scan.err"
          findings="$RUNNER_TEMP/findings.jsonl"

          # Reports a scan that did not complete, then ends the job green: a broken scanner is not a finding.
          incomplete() {
            echo "::warning::Snyk skill scan did not complete: $1"
            {
              echo "### Snyk skill scan did not complete"
              echo
              echo "$1"
              echo
              echo "stdout (first 4000 bytes):"
              echo '```'
              head -c 4000 "$out" || true
              echo
              echo '```'
              echo "stderr (first 4000 bytes):"
              echo '```'
              head -c 4000 "$err" || true
              echo
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # `if !` keeps a non-zero scanner exit from tripping `set -e`; stdout is the JSON document and
          # stderr carries the scanner's progress and diagnostics, so they are kept apart. The scanner retries
          # on API timeouts, so it is cut off at five minutes, inside the job's ten, and reported rather than
          # left to be killed by the runner.
          if ! timeout 300 uvx "snyk-agent-scan@$SCANNER_VERSION" --json skills > "$out" 2> "$err"; then
            incomplete "the scanner exited non-zero or ran past five minutes."
          fi

          if ! jq -e 'type == "object"' "$out" > /dev/null 2>&1; then
            incomplete "the scanner output was not a JSON object."
          fi

          # Flatten the document into one {code, skill, file, message} object per finding.
          # - Root: scan path, as passed -> {servers[], issues[], error}. servers[i].server.path is the
          #   skill's absolute directory, not its SKILL.md, so a skill's findings are pinned to its SKILL.md
          #   (an annotation on a directory attaches to nothing); issues[j].reference[0] indexes into servers.
          # - W003-W006 are internal hints the scanner's own text report hides, so they are dropped here.
          # - A path-level or server-level `error` becomes a "scan error" finding.
          # - `file` is repo-relative, or `skills/` when the path cannot be resolved under the workspace.
          # Every text field is coerced to a string here, so a scanner that changes a type cannot make the
          # emit steps below fail the job. Workflow-command escaping happens at emit time, not here.
          if ! jq -c --arg ws "$GITHUB_WORKSPACE/" '
            def repo_path($p):
              if ($p | type) == "string" and ($p | startswith($ws)) then $p[($ws | length):] else "skills/" end;
            def srv_path($srv):
              ($srv.server.path) as $p
              | if $srv.server.type == "skill" and ($p | type) == "string" then
                  (if ($p | endswith(".md")) then $p else $p + "/SKILL.md" end)
                else $p end;
            to_entries[] | .value as $r | ($r.servers // []) as $s
            | (
                ($r.issues // [])[]
                | select((.code // "") | test("^W00[3-6]$") | not)
                | (if ((.reference // []) | length) > 0 then .reference[0] else null end) as $i
                | (if $i == null then null else $s[$i] end) as $srv
                | {
                    code: (.code // "issue" | tostring),
                    skill: ($srv.name // "-" | tostring),
                    file: repo_path(srv_path($srv)),
                    message: (.message // "" | tostring)
                  }
              ),
              (
                $r.error | select(. != null)
                | {code: "scan error", skill: "-", file: repo_path($r.path), message: (.message // "unknown error" | tostring)}
              ),
              (
                $s[] | select(.error != null)
                | {code: "scan error", skill: (.name // "-" | tostring), file: repo_path(srv_path(.)), message: (.error.message // "unknown error" | tostring)}
              )
          ' "$out" > "$findings"; then
            incomplete "the scanner output did not have the documented shape."
          fi

          count=$(wc -l < "$findings" | tr -d ' ')

          if [[ "$count" -eq 0 ]]; then
            echo "Snyk skill scan (snyk-agent-scan $SCANNER_VERSION) was clean: no findings." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Workflow commands need %, CR and LF escaped in the message, and also `:` and `,` in properties.
          jq -r '
            def esc: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            def prop: esc | gsub(":"; "%3A") | gsub(","; "%2C");
            "::warning file=\(.file | prop),title=\("Snyk \(.code)" | prop)::\(.message | esc)"
          ' "$findings"

          {
            echo "### Snyk skill scan (snyk-agent-scan $SCANNER_VERSION): $count finding(s)"
            echo
            echo "| Code | Skill | Message |"
            echo "| --- | --- | --- |"
            jq -r '
              def cell: gsub("\\|"; "\\|") | gsub("\r?\n"; " ");
              "| \(.code | cell) | \(.skill | cell) | \(.message | cell) |"
            ' "$findings"
            echo
            echo "Reported only: the verdict is LLM-generated and this job never fails on it."
          } >> "$GITHUB_STEP_SUMMARY"
