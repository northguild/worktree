name = "worktree-gemini-proxy"
main = "dist/worker.js"
compatibility_date = "2026-01-01"
# nodejs_compat: the TanStack AI packages import node:events and node:process.
# enable_request_signal: makes request.signal fire when the client disconnects,
# which is how a closed chat tab cancels the upstream Gemini call (plan #257 §4.2).
compatibility_flags = ["nodejs_compat", "enable_request_signal"]
workers_dev = true
# Live URL: https://worktree-gemini-proxy.northguild.workers.dev

# Find your account ID: wrangler whoami  OR  https://dash.cloudflare.com → right sidebar.
# Uncomment and fill in before first deploy:
# account_id = ""

[dev]
# Pin the local dev port so the Astro frontend always finds the worker.
# If 8787 is busy, kill the other process rather than silently moving ports.
port = 8787

[vars]
# Non-secret env vars go here

# Secrets are set via: pnpm wrangler secret put GEMINI_API_KEY
